name: Windows build and regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        compiler: [msvc, mingw]
        include:
          - compiler: msvc
            standard: 17
          - compiler: mingw
            standard: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC
        if: matrix.compiler == 'msvc'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_CXX_STANDARD=${{ matrix.standard }}
      - uses: msys2/setup-msys2@v2
        if: matrix.compiler == 'mingw'
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
      - name: Configure MinGW
        if: matrix.compiler == 'mingw'
        shell: msys2 {0}
        run: |
          cygpath -w /ucrt64/bin >> "$GITHUB_PATH"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=${{ matrix.standard }} -DCMAKE_CXX_COMPILER=g++
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/setup-python@v5
        if: matrix.compiler == 'msvc'
        with:
          python-version: '3.11'
      - name: Test and package music converter
        if: matrix.compiler == 'msvc'
        shell: pwsh
        run: |
          python -m pip install -r music-converter/requirements.txt pytest==8.4.2 pyinstaller==6.16.0
          python -m pytest music-converter/tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --onefile --name music-converter --add-data "music-converter/assets;assets" --distpath build/Release music-converter/unlocker.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item music-converter/LICENSE build/Release/MUSIC-CONVERTER-LICENSE.md
          Copy-Item music-converter/UPSTREAM.md build/Release/MUSIC-CONVERTER-NOTICE.md
          $env:MUSIC_CONVERTER_EXECUTABLE = (Resolve-Path build/Release/music-converter.exe).Path
          $env:TOOLBOX_TEST_EXECUTABLE = (Resolve-Path build/Release/toolbox-tests.exe).Path
          python -m pytest music-converter/tests/test_cli.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test and package fastdl and update hashes
        if: matrix.compiler == 'msvc'
        shell: pwsh
        run: |
          python -m pip install -r fastdl-integration/requirements.txt
          python -m pytest fastdl-integration/tests -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --onefile --name fastdl --add-data "fastdl-integration/servers.txt;." --distpath build/Release fastdl-integration/dl.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item fastdl-integration/LICENSE build/Release/FASTDL-LICENSE.md
          Copy-Item fastdl-integration/UPSTREAM.md build/Release/FASTDL-NOTICE.md
          Copy-Item README.md build/Release/README.md
          $env:FASTDL_EXECUTABLE = (Resolve-Path build/Release/fastdl.exe).Path
          $env:TOOLBOX_TEST_EXECUTABLE = (Resolve-Path build/Release/toolbox-tests.exe).Path
          python -m pytest fastdl-integration/tests -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $names = @('system-toolbox.exe','music-converter.exe','fastdl.exe','README.md','MUSIC-CONVERTER-LICENSE.md','MUSIC-CONVERTER-NOTICE.md','FASTDL-LICENSE.md','FASTDL-NOTICE.md')
          $hashes = $names | ForEach-Object { $hash = Get-FileHash -LiteralPath "build/Release/$_" -Algorithm SHA256; "$($hash.Hash)  $_" }
          $hashes | Set-Content build/Release/SHA256SUMS.txt -Encoding ascii
          Compress-Archive -Path ($names | ForEach-Object { "build/Release/$_" }) -DestinationPath build/Release/system-toolbox-windows.zip -Force
      - uses: actions/upload-artifact@v4
        if: matrix.compiler == 'msvc'
        with:
          name: system-toolbox-windows
          path: |
            build/Release/system-toolbox.exe
            build/Release/README.md
            build/Release/music-converter.exe
            build/Release/MUSIC-CONVERTER-LICENSE.md
            build/Release/MUSIC-CONVERTER-NOTICE.md
            build/Release/fastdl.exe
            build/Release/FASTDL-LICENSE.md
            build/Release/FASTDL-NOTICE.md
            build/Release/SHA256SUMS.txt
            build/Release/system-toolbox-windows.zip
